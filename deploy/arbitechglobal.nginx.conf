server {
    listen 80;
    listen [::]:80;
    server_name arbitechglobal.com www.arbitechglobal.com;
    return 301 https://arbitechglobal.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.arbitechglobal.com;
    ssl_certificate /etc/letsencrypt/live/arbitechglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arbitechglobal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://arbitechglobal.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arbitechglobal.com;
    ssl_certificate /etc/letsencrypt/live/arbitechglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arbitechglobal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /internal/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:13080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
