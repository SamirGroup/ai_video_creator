name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Backend: Django + DRF + Celery (backend/)
  # Runs lint -> test against real Postgres/Redis service containers.
  # Guarded with `hashFiles` checks so this workflow doesn't hard-fail while
  # backend/ is still being scaffolded in parallel by backend-developer.
  # ==========================================================================
  backend-ci:
    name: backend-ci (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_youtuber_test
          POSTGRES_USER: ai_youtuber
          POSTGRES_PASSWORD: ai_youtuber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_youtuber -d ai_youtuber_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "false"
      DATABASE_URL: postgres://ai_youtuber:ai_youtuber@localhost:5432/ai_youtuber_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend/ exists
        id: backend_check
        run: |
          if [ -f "backend/requirements.txt" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::backend/requirements.txt not found yet — skipping backend-ci steps (expected while backend-developer is still scaffolding the project)."
          fi

      - name: Set up Python
        if: steps.backend_check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        if: steps.backend_check.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest pytest-django pytest-cov

      - name: Lint (ruff)
        if: steps.backend_check.outputs.present == 'true'
        working-directory: backend
        run: ruff check .

      - name: Run migrations check
        if: steps.backend_check.outputs.present == 'true'
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Test (pytest)
        if: steps.backend_check.outputs.present == 'true'
        working-directory: backend
        run: pytest --cov=. --cov-report=term-missing

  # ==========================================================================
  # Frontend: React + Vite (frontend/)
  # Guarded the same way while frontend-developer is still scaffolding.
  # ==========================================================================
  frontend-ci:
    name: frontend-ci (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend/ exists
        id: frontend_check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::frontend/package.json not found yet — skipping frontend-ci steps (expected while frontend-developer is still scaffolding the project)."
          fi

      - name: Set up Node.js
        if: steps.frontend_check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend_check.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.frontend_check.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        if: steps.frontend_check.outputs.present == 'true'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
