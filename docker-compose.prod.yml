########################################################################
# Production override — single VPS/Cloud VM deploy (SPEC decision A-25:
# "MVP'da Docker Compose + bitta VPS/Cloud VM, Kubernetes F2'ga qoldirilgan").
#
# Usage (on the VPS):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# See deploy/deploy.sh for the scripted zero-downtime rollout + rollback flow,
# and README.md "Production deploy" section for the manual walkthrough.
########################################################################

services:

  db:
    # Prefer a managed PostgreSQL (RDS/Cloud SQL/DO Managed DB) in production
    # per SPEC A-25 note ("+ managed PostgreSQL"). If you do use the
    # containerized db instead, never expose 5432 publicly.
    ports: []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    ports: []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  backend:
    build:
      target: prod
    volumes: []
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -
    environment:
      - DJANGO_DEBUG=false
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Run once per deploy (as a one-off `docker compose run --rm migrate`), not as a
  # long-running service — keeps schema migration explicit and out of the
  # container startup path (zero-downtime: apply backward-compatible
  # migrations BEFORE swapping backend/worker images, per NFR-39).
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    env_file:
      - .env
    command: python manage.py migrate --noinput
    profiles: ["tools"]
    networks:
      - app_net

  collectstatic:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    env_file:
      - .env
    command: python manage.py collectstatic --noinput
    profiles: ["tools"]
    volumes:
      - static_data:/app/staticfiles
    networks:
      - app_net

  celery_worker:
    build:
      target: prod
    volumes: []
    restart: always
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  celery_beat:
    build:
      target: prod
    volumes: []
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      target: prod
    restart: always
    ports:
      - "3000:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  static_data:
