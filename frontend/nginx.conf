server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nothing was compressed before this: the landing bundle alone is ~1.5 MB
    # of JavaScript, and the landing copy for 30 locales is a few hundred kB of
    # JSON — both mostly text, so they shrink by roughly three quarters.
    # `gzip_proxied any` matters because this server sits behind the host nginx.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # The host nginx proxies here over HTTP/1.0, and gzip_http_version defaults
    # to 1.1 — without this, everything above is silently skipped in production
    # while still working when tested against the container directly.
    gzip_http_version 1.0;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        application/font-woff;

    # The public landing at "/" is the standalone myweb.uz build in
    # public/mw/ — a self-contained, scroll-only page with no client-side
    # routing, so it can own the root without shadowing anything. Every other
    # path (/login, /dashboard, ...) still goes to the React app below.
    #
    # Its index.html references /mw/assets/... absolutely: served at "/", a
    # relative reference would resolve to /assets/, which is the React app's.
    location = / {
        try_files /mw/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback: any unknown path resolves to index.html so react-router
    # (browser history mode) can render the matching client-side route.
    #
    # index.html must never be cached. It is the only file whose name is stable
    # across deploys, and it is what points at the hashed bundles: a browser
    # that holds an old copy keeps loading the old (immutable, year-long
    # cached) assets and never sees a release at all. Without this, browsers
    # apply heuristic caching to a response carrying only Last-Modified.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Hashed filenames, so a year is safe: a new build means a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
